<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CivicCompass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            overscroll-behavior: none;
            overflow: hidden;
        }
        /* Pulse animation for recording state */
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .recording-pulse {
            animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        /* Scanner line animation for processing */
        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
        .scan-line {
            position: absolute;
            left: 0;
            width: 100%;
            height: 2px;
            background: #4ade80;
            box-shadow: 0 0 10px #4ade80;
            animation: scan 2s linear infinite;
        }
    </style>
    <script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react/": "https://aistudiocdn.com/react@^19.2.1/"
  }
}
</script>
</head>
<body class="relative h-screen w-screen text-white select-none">

    <!-- Video Feed -->
    <video id="camera-feed" class="absolute inset-0 w-full h-full object-cover z-0" autoplay playsinline muted></video>

    <!-- Canvas Overlay for Bounding Boxes -->
    <canvas id="overlay-canvas" class="absolute inset-0 w-full h-full pointer-events-none z-10"></canvas>

    <!-- Processing Effect Overlay -->
    <div id="scan-overlay" class="absolute inset-0 pointer-events-none z-10 hidden">
        <div class="scan-line"></div>
        <div class="absolute inset-0 bg-green-500/10"></div>
    </div>

    <!-- Top Text Readout -->
    <div class="absolute top-0 left-0 right-0 p-6 z-20 pointer-events-none transition-all duration-300">
        <div id="info-box" class="bg-black/70 backdrop-blur-md rounded-2xl p-5 border border-white/10 shadow-lg transform transition-all duration-500 translate-y-0 opacity-100">
            <h1 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">CivicCompass AI</h1>
            <p id="main-text" class="text-lg font-medium leading-relaxed">Point at a form, hold the button, and ask a question.</p>
            <p id="sub-text" class="text-sm text-gray-400 mt-2 hidden"></p>
        </div>
    </div>

    <!-- Bottom Controls -->
    <div class="absolute bottom-12 left-0 right-0 z-30 flex flex-col items-center justify-center gap-4">
        
        <!-- Microphone Button -->
        <button id="mic-btn" class="group relative flex items-center justify-center w-20 h-20 rounded-full bg-white transition-all active:scale-95 touch-none outline-none focus:outline-none">
             <!-- Pulse Effect Ring (Active when recording) -->
             <div id="mic-pulse" class="absolute inset-0 rounded-full bg-red-500 opacity-0 transition-opacity duration-200"></div>
             
             <!-- Icon -->
             <div class="relative z-10">
                <svg id="mic-icon" xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-slate-900 group-active:text-white transition-colors duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                </svg>
                
                <!-- Stop/Square Icon (visible when recording) -->
                <div id="stop-icon" class="hidden w-6 h-6 bg-white rounded-sm"></div>
             </div>
        </button>
        
        <p id="action-hint" class="text-sm font-medium text-white/80 bg-black/50 px-3 py-1 rounded-full backdrop-blur-sm">Hold to Speak</p>
    </div>

    <script type="module">
        import { GoogleGenAI, Type } from "@google/genai";

        // --- Configuration & State ---
        const API_KEY = process.env.API_KEY; // Using env variable as required
        const MODEL_NAME = "gemini-3-pro-preview"; // Best for complex reasoning/coordinates
        
        const state = {
            isRecording: false,
            isProcessing: false,
            stream: null,
            audioStream: null,
            mediaRecorder: null,
            audioChunks: [],
            boundingBox: null // [ymin, xmin, ymax, xmax]
        };

        const ui = {
            video: document.getElementById('camera-feed'),
            canvas: document.getElementById('overlay-canvas'),
            ctx: document.getElementById('overlay-canvas').getContext('2d'),
            micBtn: document.getElementById('mic-btn'),
            micPulse: document.getElementById('mic-pulse'),
            micIcon: document.getElementById('mic-icon'),
            stopIcon: document.getElementById('stop-icon'),
            infoBox: document.getElementById('info-box'),
            mainText: document.getElementById('main-text'),
            subText: document.getElementById('sub-text'),
            scanOverlay: document.getElementById('scan-overlay'),
            actionHint: document.getElementById('action-hint')
        };

        // --- System Instructions & Schema ---
        const SYSTEM_INSTRUCTION = `
        You are an empathetic social worker assistant. Your goal is to help users with low literacy fill out physical government forms. 
        1. Analyze the image of the form provided.
        2. Listen to the user's audio question (which may be in a non-English language like Spanish, Hindi, etc.).
        3. Identify the specific form field they are asking about.
        4. Return the bounding box coordinates [ymin, xmin, ymax, xmax] of that specific field on the page.
        5. Provide a helpful, simple explanation in the user's *native language* (the same language they spoke).
        6. Also provide a translation of what they asked in English.
        If the user's intent is unclear or the field is not visible, return null for coordinates.
        `;

        const responseSchema = {
            type: Type.OBJECT,
            properties: {
                translated_user_intent: { type: Type.STRING, description: "User's question in English" },
                form_field_coordinates: { 
                    type: Type.ARRAY, 
                    description: "[ymin, xmin, ymax, xmax] relative to image 0-1",
                    items: { type: Type.NUMBER }
                },
                native_language_response: { type: Type.STRING, description: "Helpful answer in native language" }
            },
            required: ["translated_user_intent", "native_language_response"]
        };

        // --- Initialization ---
        async function init() {
            try {
                // Video Stream (Back Camera)
                state.stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
                    audio: false
                });
                ui.video.srcObject = state.stream;

                // Audio Stream (for recording)
                state.audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                setupEvents();
                resizeCanvas();
                window.addEventListener('resize', resizeCanvas);
                requestAnimationFrame(drawLoop);
            } catch (err) {
                console.error("Camera/Mic Error:", err);
                ui.mainText.textContent = "Error: Camera or Microphone access denied. Please verify permissions.";
                ui.infoBox.classList.add('border-red-500');
            }
        }

        function setupEvents() {
            // Touch/Mouse events for "Hold to Record"
            const startHandler = (e) => {
                if (e.cancelable) e.preventDefault();
                if (!state.isProcessing) startRecording();
            };
            const stopHandler = (e) => {
                if (e.cancelable) e.preventDefault();
                if (state.isRecording) stopRecording();
            };

            ui.micBtn.addEventListener('mousedown', startHandler);
            ui.micBtn.addEventListener('touchstart', startHandler);
            
            ui.micBtn.addEventListener('mouseup', stopHandler);
            ui.micBtn.addEventListener('mouseleave', stopHandler);
            ui.micBtn.addEventListener('touchend', stopHandler);
        }

        // --- Recording Logic ---
        function startRecording() {
            state.isRecording = true;
            state.audioChunks = [];
            state.boundingBox = null; // Clear previous result
            ui.subText.classList.add('hidden');
            
            // UI Updates
            ui.micPulse.classList.add('recording-pulse', 'opacity-100');
            ui.micIcon.classList.add('text-white');
            ui.mainText.textContent = "Listening...";
            ui.actionHint.textContent = "Release to Send";
            ui.infoBox.classList.replace('bg-black/70', 'bg-red-900/80');

            try {
                state.mediaRecorder = new MediaRecorder(state.audioStream);
                state.mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) state.audioChunks.push(e.data);
                };
                state.mediaRecorder.start();
            } catch (e) {
                console.error("Recorder Error", e);
                resetUI();
            }
        }

        async function stopRecording() {
            if (!state.mediaRecorder) return;
            
            state.isRecording = false;
            state.mediaRecorder.stop();
            
            // Wait briefly for data to be available
            await new Promise(resolve => setTimeout(resolve, 100));

            // Start Processing
            state.isProcessing = true;
            
            // UI Updates
            ui.micPulse.classList.remove('recording-pulse', 'opacity-100');
            ui.scanOverlay.classList.remove('hidden');
            ui.mainText.textContent = "Analyzing form...";
            ui.actionHint.textContent = "Processing...";
            ui.infoBox.classList.replace('bg-red-900/80', 'bg-black/70');
            
            // Capture Data
            const imageBase64 = captureVideoFrame();
            const audioBlob = new Blob(state.audioChunks, { type: 'audio/webm' });
            const audioBase64 = await blobToBase64(audioBlob);

            // Call API
            callGeminiAPI(imageBase64, audioBase64);
        }

        // --- Gemini Integration ---
        async function callGeminiAPI(imageBase64, audioBase64) {
            try {
                const ai = new GoogleGenAI({ apiKey: API_KEY });
                
                const response = await ai.models.generateContent({
                    model: MODEL_NAME,
                    config: {
                        systemInstruction: SYSTEM_INSTRUCTION,
                        responseMimeType: "application/json",
                        responseSchema: responseSchema
                    },
                    contents: {
                        parts: [
                            { inlineData: { mimeType: "image/jpeg", data: imageBase64 } },
                            { inlineData: { mimeType: "audio/webm", data: audioBase64 } }
                        ]
                    }
                });

                const result = JSON.parse(response.text);
                handleSuccess(result);

            } catch (error) {
                console.error("Gemini API Failed", error);
                ui.mainText.textContent = "Sorry, I couldn't understand. Please try again.";
                state.isProcessing = false;
                ui.scanOverlay.classList.add('hidden');
                ui.actionHint.textContent = "Hold to Speak";
            }
        }

        function handleSuccess(data) {
            state.isProcessing = false;
            ui.scanOverlay.classList.add('hidden');
            ui.actionHint.textContent = "Hold to Speak";

            // Update Text
            ui.mainText.textContent = data.native_language_response;
            ui.subText.textContent = `You asked: "${data.translated_user_intent}"`;
            ui.subText.classList.remove('hidden');
            ui.infoBox.classList.add('border-green-500/50');

            // Update Coordinates
            if (data.form_field_coordinates && data.form_field_coordinates.length === 4) {
                state.boundingBox = data.form_field_coordinates;
            } else {
                state.boundingBox = null;
            }
        }

        // --- Helpers ---
        function captureVideoFrame() {
            const canvas = document.createElement('canvas');
            canvas.width = ui.video.videoWidth;
            canvas.height = ui.video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(ui.video, 0, 0);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
            return dataUrl.split(',')[1];
        }

        function blobToBase64(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result.split(',')[1]);
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }

        function resetUI() {
            state.isRecording = false;
            state.isProcessing = false;
            ui.micPulse.classList.remove('recording-pulse', 'opacity-100');
            ui.actionHint.textContent = "Hold to Speak";
        }

        function resizeCanvas() {
            ui.canvas.width = window.innerWidth;
            ui.canvas.height = window.innerHeight;
        }

        // --- Visual Loop ---
        function drawLoop() {
            const ctx = ui.ctx;
            const w = ui.canvas.width;
            const h = ui.canvas.height;
            
            ctx.clearRect(0, 0, w, h);

            if (state.boundingBox) {
                const [ymin, xmin, ymax, xmax] = state.boundingBox;
                
                // Coordinates are relative to the VIDEO frame, not the screen aspect ratio
                // But for simplicity in a full-screen cover video, we map 0-1 to screen width/height 
                // assuming the object-cover centers the video. 
                // A production app would calculate the aspect ratio crop, but this suffices for the prototype.
                
                const boxX = xmin * w;
                const boxY = ymin * h;
                const boxW = (xmax - xmin) * w;
                const boxH = (ymax - ymin) * h;

                // Pulsing Green Box
                const pulseAmount = (Math.sin(Date.now() / 200) + 1) / 2; // 0 to 1
                ctx.strokeStyle = `rgba(74, 222, 128, ${0.5 + (pulseAmount * 0.5)})`; // Green-400
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#4ade80';
                
                // Draw Box
                ctx.strokeRect(boxX, boxY, boxW, boxH);
                
                // Draw Label "Write Here"
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#4ade80';
                const labelW = 100;
                const labelH = 24;
                const labelX = boxX + (boxW/2) - (labelW/2);
                const labelY = boxY - 30;
                
                // Label BG
                ctx.fillStyle = 'rgba(0,0,0,0.8)';
                roundRect(ctx, labelX, labelY, labelW, labelH, 4);
                ctx.fill();

                // Label Text
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 12px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('WRITE HERE', labelX + (labelW/2), labelY + 16);
            }

            requestAnimationFrame(drawLoop);
        }

        function roundRect(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
        }

        // Start
        init();

    </script>
</body>
</html>
